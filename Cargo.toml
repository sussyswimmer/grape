[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "crates/grape-core",
    "crates/grape-engines",
    "crates/grape-heif-proto",
    "crates/grape-platform",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/sussyswimmer/grape"
publish = false

[workspace.dependencies]
grape-core = { path = "crates/grape-core" }
grape-engines = { path = "crates/grape-engines" }
grape-heif-proto = { path = "crates/grape-heif-proto" }
grape-platform = { path = "crates/grape-platform" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
proptest = "1.11.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
