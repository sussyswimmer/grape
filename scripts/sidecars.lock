{
  "_comment": [
    "The sidecar builds Grape bundles, pinned. This file is the one source of truth for them.",
    "The pin is DECISIONS D22 (lane B). How the builds are fetched and checked is D25.",
    "Read by scripts/fetch-sidecars.ps1 (Windows) and scripts/fetch-sidecars.sh (macOS). Change a pin here, never in the scripts.",
    "archives: one entry per download: its https URL, the SHA-256 of the archive itself (checked before anything is extracted) and its size in bytes.",
    "sidecars: per program, its version (the first line of '<name> -hide_banner -version' must name it) and, per target triple, the archive it comes from and its path inside that archive. One archive can supply several files.",
    "license: a file inside the archive that the script keeps as binaries/<name>-LICENSE.txt for the bundle step. It is not the licenses/ folder, which is committed and written by hand (licenses/README.md).",
    "macOS: the two Apple triples are merged with lipo into <name>-universal-apple-darwin and signed ad hoc. All three files stay in binaries/, because tauri-build looks for the per-arch ones.",
    "heif-enc is not pinned yet (lane B). It goes under sidecars like the others, with its own archive, and only a Windows target: the Mac encodes HEIC with ImageIO. The scripts' version check is FFmpeg's ('-hide_banner -version', first line '<name> version ...'), which heif-enc doesn't answer, so fetch-sidecars.ps1 needs a check for heif-enc before it goes in.",
    "After changing this file, run the fetch script on both OSes. CI's Sidecars job keys its cache on the hashes of this file and both fetch scripts."
  ],
