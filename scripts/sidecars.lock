{
  "_comment": [
    "The third-party builds Grape fetches, pinned. This file is the one source of truth for them.",
    "DEV TESTING ONLY for the FFmpeg entries: the BtbN and martin-riedl builds below are never bundled. Both link GPL-2.0-only code (libzvbi) into a GPL-3.0 build and about 100 libraries Grape doesn't use, so Grape builds its own minimal FFmpeg instead (D24, lane B), and these entries will point at that build's assets on Grape's own GitHub Release.",
    "The FFmpeg pin is DECISIONS D22 (lane B), the PDFium pin is D29. How the builds are fetched and checked is D25 (and D29 for libraries).",
    "Read by scripts/fetch-sidecars.ps1 (Windows) and scripts/fetch-sidecars.sh (macOS). Change a pin here, never in the scripts.",
    "archives: one entry per download: its https URL, the SHA-256 of the archive itself (checked before anything is extracted) and its size in bytes. The URL's ending says how to extract it: .zip, or .tgz / .tar.gz (the OS's own tar: %SystemRoot%\\System32\\tar.exe, /usr/bin/tar).",
    "sidecars: programs Grape runs. Per program, its version (the first line of '<name> -hide_banner -version' must name it) and, per target triple, the archive it comes from and its path inside that archive. One archive can supply several files. They land in binaries/ as <name>-<triple>[.exe], Tauri's externalBin names.",
    "libraries: shared libraries Grape loads (PDFium). Per library, its version (shown only; a library can't be run) and, per target, the archive, the path inside it and the SHA-256 of that extracted file, checked before it's placed. They land in binaries/ as <file stem>-<triple><extension>: pdfium-x86_64-pc-windows-msvc.dll, libpdfium-universal-apple-darwin.dylib. The Mac library is given as universal-apple-darwin (the script doesn't merge libraries with lipo), is signed ad hoc again, and is also copied to binaries/macos/<file name>, because bundle.macOS.frameworks keeps a file's name.",
    "license: a file inside the archive that the script keeps as binaries/<name>-LICENSE.txt for the bundle step. It is not the licenses/ folder, which is committed and written by hand (licenses/README.md).",
    "macOS sidecars: the two Apple triples are merged with lipo into <name>-universal-apple-darwin and signed ad hoc. All three files stay in binaries/, because tauri-build looks for the per-arch ones.",
    "HEIC on Windows is grape-heif, built by CI from tools/grape-heif (D33), never fetched: nothing for it goes here. The Mac converts HEIC with ImageIO.",
    "A sidecar and a library can't share a name: -Only / --only <name> fetches just that one.",
    "After changing this file, run the fetch script on both OSes. CI keys its caches on the hashes of this file and both fetch scripts: the Sidecars job fetches everything, and the Rust and build jobs fetch only pdfium."
  ],
