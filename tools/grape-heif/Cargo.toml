[package]
name = "grape-heif"
description = "Grape's HEIC helper for Windows: libheif, libde265 and x265 behind the grape-heif-proto protocol (DECISIONS D33)"
# libheif's version, then Grape's build number. The banner prints it, and the
# codec refuses to run against any other libheif.
version = "1.23.7-grape.1"
edition = "2021"
# Grape's own source in this folder is MIT. The built grape-heif.exe links
# libheif and libde265 (LGPL-3.0-or-later) and x265 (GPL-2.0-or-later)
# statically, so the program as a whole is GPL-3.0-or-later. It ships only as
# a separate executable (golden rule 6), with licenses/grape-heif.
license = "MIT"
repository = "https://github.com/sussyswimmer/grape"
publish = false
default-run = "grape-heif"

# Its own workspace: never part of Grape's `cargo test --workspace`, which
# must build without vcpkg's C libraries (D33).
[workspace]

[dependencies]
# Default feature `latest` = the libheif 1.23 API.
libheif-rs = "=3.0.0"
# Direct, for heif_get_version and heif_get_plugin_directories (the banner).
libheif-sys = { version = "=5.3.1", features = ["v1_23"] }
grape-heif-proto = { path = "../../crates/grape-heif-proto" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
] }

[dev-dependencies]
serde_json = "=1.0.151"

[[bin]]
name = "grape-heif"
path = "src/main.rs"

# Writes the HEIC test fixtures (heic-spec §5.6). CI only, never shipped.
[[bin]]
name = "grape-heif-fixtures"
path = "src/bin/grape-heif-fixtures.rs"

[profile.release]
lto = "thin"
codegen-units = 1
# grape-heif-proto's serve catches a codec's panic and reports it.
panic = "unwind"

# Grape's workspace lints, copied (this is its own workspace).
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
