[package]
name = "grape-platform"
description = "OS glue for Grape: drag detection, modifiers, display bounds, file actions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
# Notes for the app's log, such as why Terminal opened another app than the
# one picked in Settings. The app already builds this version (DECISIONS D9).
log = "0.4.34"

# Only Windows builds pull in the Win32 bindings. Tauri 2.12 uses `windows ^0.62`,
# so this shares that build. wry and tao already enable the Win32 features
# below except Win32_Storage_FileSystem and Win32_UI_Shell_Common (drag-out's
# shell data object). Nothing else in the build enables the WinRT ones
# (Foundation, ApplicationModel_DataTransfer, Storage, Storage_Streams: the
# share sheet), so those and the two Win32 ones add new bindings to the build
# (DECISIONS D9, D13). Win32_Security (CreateJobObjectW's attributes) and
# Win32_System_JobObjects are the HEIC helper's Job Object (`windows::job`,
# D33): bindings only, no new package.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "ApplicationModel_DataTransfer",
    "Foundation",
    "Storage",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
# The COM `#[implement]` macro (Grape's IDropTarget) expands to `windows_core`
# paths, so the crate must be a direct dependency. Same version wry and tao
# already build.
windows-core = "0.62.2"
# `IIterable<IStorageItem>` from a Vec, for the share sheet's file list: the
# windows crate doesn't re-export it. The version the windows crate already
# builds, so the package is already in Cargo.lock (MIT OR Apache-2.0).
windows-collections = "0.3.2"

# Only macOS builds pull in the AppKit bindings (DECISIONS D18). tao and wry
# already build every one of these crates at these versions, so nothing new
# enters Cargo.lock; the features are the smallest set the code needs.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.5", default-features = false, features = [
    "std",
    "exception",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSArray",
    "NSEnumerator",
    "NSError",
    "NSFileManager",
    "NSGeometry",
    "NSProcessInfo",
    "NSString",
    "NSURL",
] }
# `libc` only types NSRunningApplication's `processIdentifier` (pid_t); the
# libc crate is already in the build. The float shelf's drag out (D43) adds
# `NSDragging`, `NSDraggingItem` and `NSDraggingSession` (the source
# protocol, the items, the session and the call that begins it),
# `NSGraphicsContext` (the type of the drag event constructor's `context`
# parameter) and `NSImage` (the drag image): bindings only, no new package.
# `NSWorkspace` also turns on objc2-foundation's `NSNotification` and
# `NSDictionary`, which the shelf's activation observer uses.
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "libc",
    "objc2-core-foundation",
    "NSAlert",
    "NSApplication",
    "NSButton",
    "NSControl",
    "NSDragging",
    "NSDraggingItem",
    "NSDraggingSession",
    "NSEvent",
    "NSGraphicsContext",
    "NSHapticFeedback",
    "NSImage",
    "NSOpenPanel",
    "NSPanel",
    "NSPasteboard",
    "NSResponder",
    "NSRunningApplication",
    "NSSavePanel",
    "NSScreen",
    "NSSharingService",
    "NSView",
    "NSWindow",
    "NSWorkspace",
] }
# Display bounds off the main thread (CGGetActiveDisplayList, CGDisplayBounds),
# and the HEIC worker's pixels (`macos::heif`, D33): images, color spaces,
# the bitmap context it draws into and the data provider it encodes from.
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "std",
    "CGBitmapContext",
    "CGColorSpace",
    "CGContext",
    "CGDataProvider",
    "CGDirectDisplay",
    "CGError",
    "CGImage",
] }
# The HEIC worker's codec (`macos::heif`, D33): ImageIO's image source and
# destination. The one new package in Cargo.lock for HEIC (2025-10-04,
# Zlib OR Apache-2.0 OR MIT). Without its `objc2` and `block2` features it
# needs only the two crates below, which the build already has.
objc2-image-io = { version = "0.3.2", default-features = false, features = [
    "std",
    "CGImageDestination",
    "CGImageProperties",
    "CGImageSource",
    "objc2-core-graphics",
] }
# The CoreFoundation values ImageIO takes and returns. Already in the build
# through objc2-foundation; now direct, for these features.
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFArray",
    "CFBase",
    "CFCGTypes",
    "CFData",
    "CFDictionary",
    "CFNumber",
    "CFString",
    "CFURL",
] }
# `dlsym` for CGImageSourceSetAllowableTypes (macOS 14.2+), which a bound
# import would stop Grape from launching on macOS 13. Already in the build.
libc = "0.2.190"
# The HEIC worker's protocol: `macos::heif` implements its `Codec`.
grape-heif-proto.workspace = true
# The main queue, for AppKit work that must run on the main thread.
dispatch2 = { version = "0.3.1", default-features = false, features = [
    "std",
    "objc2",
] }

[features]
# The HEIC tests that need a real codec (D33): the `grape-heif-worker` test
# bin (ImageIO on macOS), `tests/heif_imageio.rs` (macOS, with
# GRAPE_TEST_HEIF_FIXTURES) and, on Windows, `tests/job_object.rs`'s
# grape-heif.exe case (GRAPE_TEST_HEIF). CI's heif-it jobs turn it on.
heif-it = []

[dev-dependencies]
# tests/job_object.rs writes protocol requests to grape-heif.exe.
grape-heif-proto.workspace = true
serde_json.workspace = true

# ImageIO behind the HEIC protocol, for grape-engines' Mac heif-it tests
# (GRAPE_TEST_HEIF). Elsewhere it says "macOS only" and exits 2.
[[bin]]
name = "grape-heif-worker"
path = "src/bin/grape-heif-worker.rs"
required-features = ["heif-it"]

[[test]]
name = "heif_imageio"
path = "tests/heif_imageio.rs"
required-features = ["heif-it"]

[lints]
workspace = true
