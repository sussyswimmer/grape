[package]
name = "grape-platform"
description = "OS glue for Grape: drag detection, modifiers, display bounds, file actions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true

# Only Windows builds pull in the Win32 bindings. Tauri 2.12 uses `windows ^0.62`,
# so this shares that build. wry already enables every feature below except
# Win32_System_Threading, so they add no new code to the build (DECISIONS D13).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# The COM `#[implement]` macro (Grape's IDropTarget) expands to `windows_core`
# paths, so the crate must be a direct dependency. Same version wry and tao
# already build.
windows-core = "0.62.2"

[lints]
workspace = true
