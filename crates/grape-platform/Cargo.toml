[package]
name = "grape-platform"
description = "OS glue for Grape: drag detection, modifiers, display bounds, file actions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
# Notes for the app's log, such as why Terminal opened another app than the
# one picked in Settings. The app already builds this version (DECISIONS D9).
log = "0.4.34"

# Only Windows builds pull in the Win32 bindings. Tauri 2.12 uses `windows ^0.62`,
# so this shares that build. wry and tao already enable the Win32 features
# below except Win32_Storage_FileSystem and Win32_UI_Shell_Common (drag-out's
# shell data object). Nothing else in the build enables the WinRT ones
# (Foundation, ApplicationModel_DataTransfer, Storage, Storage_Streams: the
# share sheet), so those and the two Win32 ones add new bindings to the build
# (DECISIONS D9, D13). Win32_Security (CreateJobObjectW's attributes) and
# Win32_System_JobObjects are the HEIC helper's Job Object (`windows::job`,
# D33): bindings only, no new package.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "ApplicationModel_DataTransfer",
    "Foundation",
    "Storage",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
# The COM `#[implement]` macro (Grape's IDropTarget) expands to `windows_core`
# paths, so the crate must be a direct dependency. Same version wry and tao
# already build.
windows-core = "0.62.2"
# `IIterable<IStorageItem>` from a Vec, for the share sheet's file list: the
# windows crate doesn't re-export it. The version the windows crate already
# builds, so the package is already in Cargo.lock (MIT OR Apache-2.0).
windows-collections = "0.3.2"

# Only macOS builds pull in the AppKit bindings (DECISIONS D18). tao and wry
# already build every one of these crates at these versions, so nothing new
# enters Cargo.lock; the features are the smallest set the code needs.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.5", default-features = false, features = [
    "std",
    "exception",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSArray",
    "NSEnumerator",
    "NSError",
    "NSFileManager",
    "NSGeometry",
    "NSProcessInfo",
    "NSString",
    "NSURL",
] }
# `libc` only types NSRunningApplication's `processIdentifier` (pid_t); the
# libc crate is already in the build.
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "libc",
    "objc2-core-foundation",
    "NSAlert",
    "NSApplication",
    "NSButton",
    "NSControl",
    "NSEvent",
    "NSHapticFeedback",
    "NSOpenPanel",
    "NSPanel",
    "NSPasteboard",
    "NSResponder",
    "NSRunningApplication",
    "NSSavePanel",
    "NSScreen",
    "NSSharingService",
    "NSView",
    "NSWindow",
    "NSWorkspace",
] }
# Display bounds off the main thread (CGGetActiveDisplayList, CGDisplayBounds).
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "std",
    "CGDirectDisplay",
    "CGError",
] }
# The main queue, for AppKit work that must run on the main thread.
dispatch2 = { version = "0.3.1", default-features = false, features = [
    "std",
    "objc2",
] }

[features]
# The HEIC tests that need a real codec (D33): on Windows,
# `tests/job_object.rs`'s grape-heif.exe case (GRAPE_TEST_HEIF). CI's heif-it
# jobs turn it on.
heif-it = []

[dev-dependencies]
# tests/job_object.rs writes protocol requests to grape-heif.exe.
grape-heif-proto.workspace = true
serde_json.workspace = true

[lints]
workspace = true
