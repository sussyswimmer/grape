[package]
name = "grape-engines"
description = "Executes grape-core job plans: images, FFmpeg sidecar, PDF, archives, subtitles"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Real audio and video conversions through FFmpeg; needs GRAPE_TEST_FFMPEG
# and GRAPE_TEST_FFPROBE set to the sidecars' absolute paths.
engines-it = []
# Integration tests that need a PDFium library: `GRAPE_TEST_PDFIUM` names it
# (the tests fail, not skip, without it). They run the PDF worker built from
# src/bin/grape-pdf-worker.rs (DECISIONS D29).
pdf-it = []
# The RAR tests that run the real bsdtar: GRAPE_TEST_BSDTAR names it (the tests
# fail, not skip, without it). Unit tests in src/archive/rar/it.rs (D27).
rar-it = []
# The HEIC tests that run the real helper (tests/heif.rs, D33): GRAPE_TEST_HEIF
# names it (grape-heif.exe on Windows, grape-platform's grape-heif-worker on
# macOS) and GRAPE_TEST_HEIF_FIXTURES the folder CI's grape-heif job made. The
# tests fail, not skip, without them.
heif-it = []

[dependencies]
grape-core.workspace = true
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "bmp", "tiff"] }
zune-jpeg = "0.5.15"
thiserror.workspace = true
zip = { version = "=9.0.2", default-features = false, features = ["deflate-flate2", "deflate64"] }
tar = { version = "0.4.46", default-features = false }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
# RAR (D27). Both were already in Cargo.lock (flate2; lopdf → stringprep).
crc32fast = "1.5.2"
unicode-normalization = "0.1.25"
# PDF (D29). PDFium is bound at run time from an absolute path, only inside
# the PDF worker process. Never enable image_*, pdfium_enable_v8,
# pdfium_enable_xfa, pdfium_use_skia, pdfium_use_win32, static or bindings.
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_7881", "thread_safe"] }
# Never enable embed_image: it pulls image 0.25 with default features.
lopdf = { version = "=0.45.0", default-features = false }
serde.workspace = true
serde_json.workspace = true
# HEIC (D33): the protocol with Grape's HEIC helper, a separate process.
grape-heif-proto.workspace = true

# tests/heif.rs runs the HEIC helper on Windows in the Job Object an
# installed Grape puts it in (D33).
[target.'cfg(windows)'.dev-dependencies]
grape-platform.workspace = true

[[bin]]
# The PDF worker on its own, for the `pdf-it` tests. The app runs the same
# `grape_engines::pdf::worker_main` as `Grape --grape-pdf-worker`.
name = "grape-pdf-worker"
path = "src/bin/grape-pdf-worker.rs"
required-features = ["pdf-it"]

[[test]]
name = "pdf"
required-features = ["pdf-it"]

[[test]]
# Images → PDF drawn by a real PDFium (D37): GRAPE_TEST_PDFIUM.
name = "create_pdf_render"
required-features = ["pdf-it"]

[[test]]
name = "heif"
required-features = ["heif-it"]

[lints]
workspace = true
