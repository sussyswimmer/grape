name: macos-app

# Grape for macOS (DECISIONS D18): a universal (Apple silicon + Intel)
# Grape.app in a DMG, with PDFium in Contents/Frameworks (D29) and the
# sidecars in Contents/MacOS, Grape's own FFmpeg (D24) and bsdtar (D27), from
# the ffmpeg-apple-darwin and bsdtar-apple-darwin artifacts of the run that
# called this. It's ad-hoc signed, not notarized (D4). ci.yml calls it on
# every run and uploads the DMG as Grape-macOS-universal, which
# docs/PLATFORM_MACOS.md → "Running a CI build" tells people to download.
# release.yml calls it from its tag with release: true, which uploads the
# DMG as Grape-macOS-universal.dmg with its hash instead, for the draft (D45).
on:
  workflow_call:
    inputs:
      cache:
        description: Use the PDFium cache (release.yml fetches it fresh).
        type: boolean
        default: true
      ref:
        description: What to check out (release.yml passes its tag); empty for the caller's own ref.
        type: string
        default: ""
      ffmpeg-sums:
        description: The ffmpeg workflow's macos-sums output (the SHA-256 of the ffmpeg-apple-darwin artifact's SHA256SUMS).
        type: string
        required: true
      release:
        description: Upload Grape-macOS-universal.dmg and its SHA256SUMS (artifact Grape-macOS-universal-release) instead of CI's Grape-macOS-universal.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # The id stays build-macos, as in ci.yml before: rust-cache keys on it.
  build-macos:
    name: Build (macOS DMG)
    runs-on: macos-latest
    # The caller's env doesn't reach a called workflow.
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      # Builds third-party code, so it keeps no git credentials.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      # Restore and save apart, as in ci.yml's build-windows: the pdfium-macOS
      # key, which ci.yml's rust-macos shares, never holds the sidecars copied
      # in below. Without the cache PDFium is fetched fresh. The script checks
      # every hash in scripts/sidecars.lock either way (D25, D29).
      - id: pdfium-cache
        if: inputs.cache
        uses: actions/cache/restore@v6
        with:
          path: apps/desktop/src-tauri/binaries
          key: pdfium-${{ runner.os }}-${{ hashFiles('scripts/sidecars.lock', 'scripts/fetch-sidecars.ps1', 'scripts/fetch-sidecars.sh') }}
      - name: Fetch PDFium
        run: /bin/bash ./scripts/fetch-sidecars.sh --only pdfium
      - if: inputs.cache && steps.pdfium-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: apps/desktop/src-tauri/binaries
          key: ${{ steps.pdfium-cache.outputs.cache-primary-key }}
      # The sidecars from the ffmpeg and bsdtar workflows of the run that
      # called this.
      - uses: actions/download-artifact@v8
        with:
          name: ffmpeg-apple-darwin
          path: ${{ runner.temp }}/ffmpeg
      - uses: actions/download-artifact@v8
        with:
          name: bsdtar-apple-darwin
          path: ${{ runner.temp }}/bsdtar
      # Each checked against its SHA256SUMS (FFmpeg's also against the hash
      # its workflow reported, which the caller passes as ffmpeg-sums), then
      # copied under Tauri's externalBin names: the universal file for the
      # bundle and both per-arch files, which tauri-build wants while it
      # compiles each arch (D25). Artifacts lose the executable bit.
      - name: Put the sidecars in binaries
        shell: bash
        env:
          FFMPEG_SUMS: ${{ inputs.ffmpeg-sums }}
        run: |
          fail() { echo "::error::$*"; exit 1; }
          sums=$(shasum -a 256 < "$RUNNER_TEMP/ffmpeg/SHA256SUMS" | cut -d ' ' -f 1)
          [ "$sums" = "$FFMPEG_SUMS" ] || fail "The FFmpeg artifact's SHA256SUMS has SHA-256 $sums, not the $FFMPEG_SUMS the ffmpeg workflow wrote."
          (cd "$RUNNER_TEMP/ffmpeg" && shasum -a 256 -c SHA256SUMS) || fail "The FFmpeg artifact doesn't match its SHA256SUMS."
          (cd "$RUNNER_TEMP/bsdtar" && shasum -a 256 -c SHA256SUMS) || fail "The bsdtar artifact doesn't match its SHA256SUMS."
          bins=apps/desktop/src-tauri/binaries
          for triple in aarch64-apple-darwin x86_64-apple-darwin universal-apple-darwin; do
            cp "$RUNNER_TEMP/ffmpeg/ffmpeg-$triple" "$RUNNER_TEMP/ffmpeg/ffprobe-$triple" "$RUNNER_TEMP/bsdtar/bsdtar-$triple" "$bins/"
            chmod 755 "$bins/ffmpeg-$triple" "$bins/ffprobe-$triple" "$bins/bsdtar-$triple"
          done
          ls -l "$bins"
      # D28: libwebp-sys's build script compiles libwebp with
      # -march=$TARGET_CPU, so a build with it set (to native, say) would
      # ship a Grape that runs only on CPUs like this runner's.
      - name: Refuse a TARGET_CPU
        shell: bash
        run: |
          if [ -n "${TARGET_CPU+set}" ]; then echo "::error::TARGET_CPU is set ($TARGET_CPU): libwebp would be built for this runner's CPU (-march), not every Mac. Unset it."; exit 1; fi
      # The PDFium overlay adds binaries/macos/libpdfium.dylib to
      # bundle.macOS.frameworks and licenses/pdfium/ to bundle.resources. The
      # macOS sidecars overlay is the one overlay that sets externalBin
      # (ffmpeg, ffprobe, bsdtar), adds their license folders, and runs the
      # sidecar gate (D25) first. Never a second overlay that also sets
      # externalBin: it would replace the list.
      - name: Build Grape.app and the DMG
        working-directory: apps/desktop
        run: pnpm tauri build --target universal-apple-darwin --bundles app,dmg --ci --config src-tauri/tauri.pdfium.macos.conf.json --config src-tauri/tauri.sidecars.macos.conf.json
      # Every sidecar, library and license folder this build ships, in
      # Grape.app, which is what the DMG holds. The overlay must list exactly
      # these sidecars and folders, so one can't be added or dropped without
      # this list changing too. The ad-hoc app must not have the hardened
      # runtime: its library validation would refuse the ad-hoc dylib
      # (tauri.conf.json, D29).
      - name: Check every sidecar, PDFium and every license folder is in Grape.app
        shell: bash
        run: |
          fail() { echo "::error::$*"; exit 1; }
          app=target/universal-apple-darwin/release/bundle/macos/Grape.app
          sidecars="ffmpeg ffprobe bsdtar"
          folders="pdfium ffmpeg libarchive"
          listed=$(python3 -I -c 'import json, sys; b = json.load(open(sys.argv[1]))["bundle"]; print(" ".join(e.split("/")[-1] for e in b["externalBin"]) + "|" + " ".join(b["resources"].values()))' apps/desktop/src-tauri/tauri.sidecars.macos.conf.json)
          [ "$listed" = "$sidecars|licenses/ffmpeg/ licenses/libarchive/" ] ||
            fail "tauri.sidecars.macos.conf.json lists '$listed', but this check expects '$sidecars|licenses/ffmpeg/ licenses/libarchive/'."

          lib="$app/Contents/Frameworks/libpdfium.dylib"
          [ -f "$lib" ] || fail "$lib is missing."
          lipo -info "$lib"
          codesign --verify --strict "$lib" || fail "libpdfium.dylib's signature doesn't verify."

          # Grape's own builds, both halves, signed: the version line the gate
          # read in binaries/, from the copies in the app.
          for name in $sidecars; do
            f="$app/Contents/MacOS/$name"
            [ -f "$f" ] || fail "$f is missing."
            archs=$(lipo -archs "$f")
            case "$archs" in
              "x86_64 arm64" | "arm64 x86_64") ;;
              *) fail "$name in Grape.app holds '$archs', not arm64 and x86_64." ;;
            esac
            codesign --verify --strict "$f" || fail "$name's signature in Grape.app doesn't verify."
            if [ "$name" = bsdtar ]; then
              out=$("$f" --version)
              re='^bsdtar [^ ]+-grape(\.[0-9]+)? - libarchive '
            else
              out=$("$f" -hide_banner -version)
              re="^$name version [^ ]*-grape(\\.[0-9]+)?( |\$)"
            fi
            first=${out%%$'\n'*}
            echo "$name ($archs): $first"
            [[ $first =~ $re ]] || fail "$name in Grape.app isn't Grape's own build: $first"
          done
          [ ! -e "$app/Contents/MacOS/grape-heif" ] || fail "grape-heif is Windows only: on a Mac, Grape itself is the image helper (D33)."

          # Each license folder whole, byte for byte, and the notices.
          for folder in $folders; do
            for src in licenses/"$folder"/*; do
              dst="$app/Contents/Resources/licenses/$folder/$(basename "$src")"
              cmp -s "$src" "$dst" || fail "Grape.app lacks licenses/$folder/$(basename "$src"), or it differs."
            done
            echo "licenses/$folder: $(find licenses/"$folder" -type f | wc -l | tr -d ' ') files"
          done
          for f in THIRD_PARTY_NOTICES.md LICENSE.txt; do
            [ -f "$app/Contents/Resources/$f" ] || fail "$f is missing from Grape.app."
          done

          codesign --verify --strict "$app" || fail "Grape.app's signature doesn't verify."
          flags=$(codesign -d --verbose=2 "$app" 2>&1 | grep '^CodeDirectory')
          echo "$flags"
          case "$flags" in
            *runtime*)
              fail "Grape.app is signed with the hardened runtime, which refuses the ad-hoc libpdfium.dylib."
              ;;
          esac
      # The image helper worker (D33, D41) is Grape itself: `Grape
      # --grape-heif-worker` answers a probe with ImageIO, on each slice the
      # runner can run, and says it writes AVIF: the app's macOS build turns
      # on grape-platform's avif-encode (rav1e), in both slices.
      # CGImageSourceSetAllowableTypes (macOS 14.2+) must only be looked up
      # with dlsym: a bound import would stop Grape launching on macOS 13
      # (its minimum), and this runner, which has the symbol, wouldn't notice.
      - name: Check the image helper worker answers and Grape launches on macOS 13
        run: |
          app=target/universal-apple-darwin/release/bundle/macos/Grape.app
          name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          bin="$app/Contents/MacOS/$name"
          if nm -um "$bin" | grep -q '_CGImageSourceSetAllowableTypes'; then
            echo "::error::$name imports CGImageSourceSetAllowableTypes directly, so it won't launch on macOS 13. Look it up with dlsym (heic-spec §7)."
            exit 1
          fi
          limits='{"maxSourceBytes":536870912,"maxPixels":134217728,"maxEncodePixels":35651584,"maxEncodeSide":16888,"maxIccBytes":16707345,"maxDecoderMemory":1073741824}'
          request='{"protocol":2,"workDir":"'"$RUNNER_TEMP"'","op":{"kind":"probe"},"limits":'"$limits"'}'
          probe() {
            set +e
            out=$(printf '%s' "$request" | "$@" --grape-heif-worker)
            code=$?
            set -e
            echo "$* --grape-heif-worker: $out (exit $code)"
            case "$out" in
              *'"done":{"caps":{"heic":{"decode":true,'*) [ "$code" -eq 0 ] || { echo "::error::The image helper worker answered but exited $code."; exit 1; } ;;
              *) echo "::error::The image helper worker didn't answer the probe with HEIC decode true."; exit 1 ;;
            esac
            case "$out" in
              *'"avif":{"decode":'*',"encode":true}'*) ;;
              *) echo "::error::The image helper worker can't write AVIF: this Grape was built without grape-platform's avif-encode (D41)."; exit 1 ;;
            esac
          }
          probe "$bin"
          # Rosetta, when this runner has it: the Intel slice too (heic-spec J36).
          if arch -x86_64 /usr/bin/true 2> /dev/null; then
            probe arch -x86_64 "$bin"
          else
            echo "No Rosetta on this runner: the x86_64 slice's worker isn't run."
          fi
      # One AVIF at the encode cap through the shipped worker (D41): an
      # 8192x4352 RGBA picture with grain and soft transparent edges, under
      # the 2 GiB heap bound the worker arms (exit 86 is "needs too much
      # memory"). rav1e runs as many threads as the runner has cores (3), not
      # the 8 of a bigger Mac; D41 has the 8-thread peaks, measured on Linux.
      - name: Encode an AVIF at the cap with the image helper worker
        run: |
          app=target/universal-apple-darwin/release/bundle/macos/Grape.app
          name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          bin="$app/Contents/MacOS/$name"
          work=$(mktemp -d "$RUNNER_TEMP/grape-heif-cap.XXXXXX")
          python3 - "$work/input.rgba" <<'PY'
          import os, struct, sys
          w, h = 8192, 4352
          # A gradient in each color byte's high bits, random grain in its low
          # four, and alpha that ramps from 0 at the sides to 255 in the middle.
          row = bytearray()
          for x in range(w):
              a = max(0, min(255, (min(x, w - 1 - x) - 256) * 2))
              row += bytes(((x * 255 // w) & 0xF0, (x * 128 // w) & 0xF0, 0x80, a))
          size = w * h * 4
          base = int.from_bytes(bytes(row) * h, "little")
          mask = int.from_bytes(b"\x0f\x0f\x0f\x00" * (w * h), "little")
          grain = int.from_bytes(os.urandom(size), "little") & mask
          with open(sys.argv[1], "wb") as f:
              f.write(b"GRAPEPX\x01" + struct.pack("<IIII", w, h, 4, 0))
              f.write((base | grain).to_bytes(size, "little"))
          PY
          limits='{"maxSourceBytes":536870912,"maxPixels":134217728,"maxEncodePixels":35651584,"maxEncodeSide":16384,"maxIccBytes":16707345,"maxDecoderMemory":1073741824}'
          request='{"protocol":2,"workDir":"'"$work"'","op":{"kind":"encode","format":"avif"},"limits":'"$limits"'}'
          set +e
          out=$(printf '%s' "$request" | /usr/bin/time -l "$bin" --grape-heif-worker 2> "$work/time.txt")
          code=$?
          set -e
          echo "$out" | tail -n 1
          grep -E 'real|maximum resident set size' "$work/time.txt" || true
          [ "$code" -ne 86 ] || { echo "::error::The worker went past its 2 GiB heap bound on an AVIF at the cap (exit 86)."; exit 1; }
          [ "$code" -eq 0 ] || { echo "::error::The worker exited $code on an AVIF at the cap."; exit 1; }
          case "$out" in
            *'"done":'*) ;;
            *) echo "::error::The worker didn't answer done for an AVIF at the cap."; exit 1 ;;
          esac
          [ "$(head -c 12 "$work/out.avif" | tail -c 4)" = avif ] || { echo "::error::out.avif isn't an AVIF."; exit 1; }
          ls -l "$work/out.avif"
          rm -rf "$work"
      # The launch smoke test, this step and the next. The SVG and PDF
      # workers are Grape itself (D39, D29): one small job each, on each
      # slice the runner can run, the PDF job loading Contents/Frameworks'
      # libpdfium.dylib. The image helper's probe and the sidecars' version
      # lines are checked above. Each run gets a minute (perl's alarm, as
      # macOS has no timeout command), and the sources must be unchanged
      # after. Nothing here goes online.
      - name: Run the SVG and PDF workers in Grape.app
        timeout-minutes: 5
        run: |
          app=target/universal-apple-darwin/release/bundle/macos/Grape.app
          name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          bin="$PWD/$app/Contents/MacOS/$name"
          pdfium="$PWD/$app/Contents/Frameworks/libpdfium.dylib"
          work=$(mktemp -d "$RUNNER_TEMP/grape-smoke.XXXXXX")
          # A 40 x 30 SVG, drawn at twice its size (it's under 256 px) and
          # opaque, so pixels.rgba holds 80 x 60 x 3 bytes after its 24-byte
          # header (grape-heif-proto's pixels.rs). A PDF with one 1-inch
          # page, rendered to PNG at 300 DPI: 300 x 300.
          python3 -I - "$work" <<'PY'
          import os, sys
          work = sys.argv[1]
          with open(os.path.join(work, "tiny.svg"), "w") as f:
              f.write('<svg xmlns="http://www.w3.org/2000/svg" width="40" height="30"><rect width="40" height="30" fill="#5b2a86"/><circle cx="20" cy="15" r="9" fill="#f2c14e"/></svg>')
          content = b"0.36 0.16 0.53 rg 0 0 72 72 re f"
          objects = [
              b"<< /Type /Catalog /Pages 2 0 R >>",
              b"<< /Type /Pages /Kids [3 0 R] /Count 1 >>",
              b"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 72 72] /Resources << >> /Contents 4 0 R >>",
              b"<< /Length %d >>\nstream\n%s\nendstream" % (len(content), content),
          ]
          pdf = bytearray(b"%PDF-1.7\n")
          offsets = []
          for i, obj in enumerate(objects, 1):
              offsets.append(len(pdf))
              pdf += b"%d 0 obj\n%s\nendobj\n" % (i, obj)
          xref = len(pdf)
          pdf += b"xref\n0 %d\n0000000000 65535 f \n" % (len(objects) + 1)
          pdf += b"".join(b"%010d 00000 n \n" % o for o in offsets)
          pdf += b"trailer\n<< /Size %d /Root 1 0 R >>\nstartxref\n%d\n%%%%EOF\n" % (len(objects) + 1, xref)
          with open(os.path.join(work, "tiny.pdf"), "wb") as f:
              f.write(pdf)
          PY
          sums=$(cd "$work" && shasum -a 256 tiny.svg tiny.pdf)
          # The app's own limits: svg::protocol::Limits::DEFAULT and
          # pdf::run's bounds.
          svg_limits='{"maxSourceBytes":67108864,"maxTextBytes":67108864,"maxNodes":2000000,"maxSide":16384,"maxPixels":67108864,"maxNestedSvgs":64,"maxDataBytes":134217728,"maxEmbeddedSide":16384,"maxEmbeddedPixels":67108864,"maxHeapBytes":2147483648}'
          pdf_bounds='{"dpi":300.0,"maxPages":2000,"maxSplitPages":100000,"maxPagePixels":100000000,"maxSide":65535,"maxOutputBytes":8589934592,"maxTextBytes":268435456,"maxDecompressed":536870912,"maxHeapBytes":4294967296}'
          bad=0
          error() { echo "::error::$*"; bad=1; }
          # worker <slice> <flag> <request> [arch -x86_64]: runs Grape as that
          # worker for at most 60 s; sets out and code.
          worker() {
            local slice=$1 flag=$2 request=$3
            shift 3
            set +e
            out=$(printf '%s' "$request" | perl -e 'alarm shift; exec @ARGV or die "exec: $!\n"' 60 "$@" "$bin" "$flag")
            code=$?
            set -e
            echo "$slice $name $flag (exit $code):"
            [ -z "$out" ] || printf '%s\n' "$out" | sed 's/^/  /'
            [ "$code" -ne 142 ] || error "$slice: $name $flag didn't finish in 60 s, so it was killed."
          }
          # check <slice> [arch -x86_64]
          check() {
            local slice=$1
            shift
            mkdir -p "$work/$slice/svg" "$work/$slice/pdf"
            worker "$slice" --grape-svg-worker '{"protocol":1,"source":"'"$work/tiny.svg"'","workDir":"'"$work/$slice/svg"'","mode":"raster","limits":'"$svg_limits"'}' "$@"
            if [ "$code" -ne 0 ] || [ "${out##*$'\n'}" != '{"done":{"width":80,"height":60,"channels":3,"leftOut":0,"scaled":false}}' ]; then
              error "$slice: $name --grape-svg-worker exited $code and didn't draw the 40 x 30 SVG at 80 x 60."
            fi
            worker "$slice" --grape-pdf-worker '{"pdfium":"'"$pdfium"'","outDir":"'"$work/$slice/pdf"'","op":{"kind":"render","source":"'"$work/tiny.pdf"'","format":"png"},"bounds":'"$pdf_bounds"'}' "$@"
            case "$code ${out##*$'\n'}" in
              '0 {"done":{"pages":1,'*) ;;
              *) error "$slice: $name --grape-pdf-worker exited $code and didn't render the one-page PDF (an error of kind library means libpdfium.dylib didn't load)." ;;
            esac
            # What each wrote: the pixel file's header, size and first pixel,
            # and the PNG's signature and size.
            python3 -I - "$work/$slice/svg/pixels.rgba" "$work/$slice/pdf/page-1.png" "$slice" <<'PY' || bad=1
          import os, struct, sys
          pixels, png, slice = sys.argv[1:4]
          ok = True
          if os.path.isfile(pixels):
              b = open(pixels, "rb").read()
              header = b[:8], struct.unpack("<IIII", b[8:24])
              print(f"{slice} pixels.rgba: {len(b)} bytes, {header[1]}, first pixel #{b[24:27].hex()}")
              if header != (b"GRAPEPX\x01", (80, 60, 3, 0)) or len(b) != 24 + 80 * 60 * 3 or b[24:27] != bytes.fromhex("5b2a86"):
                  print(f"::error::{slice}: pixels.rgba isn't 80 x 60 RGB starting with the SVG's #5b2a86.")
                  ok = False
          if os.path.isfile(png):
              b = open(png, "rb").read(24)
              size = struct.unpack(">II", b[16:24])
              print(f"{slice} page-1.png: {os.path.getsize(png)} bytes, {size[0]} x {size[1]}")
              if b[1:4] != b"PNG" or size != (300, 300):
                  print(f"::error::{slice}: page-1.png isn't a 300 x 300 PNG.")
                  ok = False
          sys.exit(0 if ok else 1)
          PY
          }
          check native
          # Rosetta, when this runner has it: the Intel slice and PDFium's
          # Intel half too.
          if arch -x86_64 /usr/bin/true 2> /dev/null; then
            check x86_64 arch -x86_64
          else
            echo "No Rosetta on this runner: the x86_64 slice's workers aren't run."
          fi
          [ "$(cd "$work" && shasum -a 256 tiny.svg tiny.pdf)" = "$sums" ] || error "A worker changed its source."
          rm -rf "$work"
          [ "$bad" -eq 0 ] || exit 1
      # Grape.app started the way Finder starts it, through LaunchServices
      # (open -n), not its executable from this shell, so it runs as a
      # user's would: from its Info.plist, with none of this step's
      # environment. Setup's lines must reach the log and Grape must still
      # run 10 s later; then a second open -n must hand over to it and exit
      # (single-instance), leaving one process, and the first logs that.
      # Then it's killed and its whole log printed. No permission is needed:
      # the drag monitor polls (D18). Launched from here, not /Volumes or a
      # translocated copy, a first launch turns launch at login on
      # (settings::first_launch_rule), and the LaunchAgent it writes is
      # removed after, so the runner is left clean.
      - name: Start Grape.app, then a second one
        timeout-minutes: 5
        run: |
          app=target/universal-apple-darwin/release/bundle/macos/Grape.app
          name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          bin="$PWD/$app/Contents/MacOS/$name"
          read -r id product < <(python3 -I -c 'import json, sys; c = json.load(open(sys.argv[1])); print(c["identifier"], c["productName"])' apps/desktop/src-tauri/tauri.conf.json)
          # tauri-plugin-log's file: <productName>.log in ~/Library/Logs/<identifier>.
          log="$HOME/Library/Logs/$id/$product.log"
          # Nothing stored yet means a first launch: launch at login goes on
          # and the welcome card opens Settings (settings.rs).
          first=yes
          [ ! -e "$HOME/Library/Application Support/$id/settings.json" ] || first=no
          # auto-launch's LaunchAgent, named after productName.
          agent="$HOME/Library/LaunchAgents/$product.plist"
          agent_before=no
          [ ! -e "$agent" ] || agent_before=yes
          start=0
          [ ! -f "$log" ] || start=$(stat -f %z "$log")
          bad=0
          error() { echo "::error::$*"; bad=1; }
          # This launch's part of the log.
          new_log() { if [ -f "$log" ]; then tail -c "+$((start + 1))" "$log"; fi; }
          has() { local text; text=$(new_log); grep -Eq -- "$1" <<< "$text"; }
          pids() { pgrep -f "$bin" || true; }
          crash_reports() {
            sleep 5
            for f in ~/Library/Logs/DiagnosticReports/"$name"*.ips; do
              [ -f "$f" ] || continue
              echo "::group::$(basename "$f")"
              head -c 100000 "$f"
              echo
              echo "::endgroup::"
            done
          }
          die() { echo "::error::$*"; crash_reports; exit 1; }
          cleanup() {
            local status=$?
            for p in $(pids); do kill "$p" 2> /dev/null || true; done
            for _ in $(seq 10); do [ -n "$(pids)" ] || break; sleep 0.5; done
            for p in $(pids); do kill -9 "$p" 2> /dev/null || true; done
            if [ "$agent_before" = no ] && [ -f "$agent" ]; then
              echo "Removing the LaunchAgent the first launch wrote, $agent:"
              plutil -p "$agent" || true
              rm -f "$agent"
            fi
            echo "Grape's log, $log:"
            if [ -f "$log" ]; then cat "$log"; else echo "(none)"; fi
            exit "$status"
          }
          trap cleanup EXIT

          out=$(open -n "$app" 2>&1) || die "open -n couldn't start Grape.app: $out (it needs a signed-in desktop session)."
          # Setup's last line (lib.rs). A tray icon that can't be made ends
          # setup before it, with a panic.
          running='\]\[grape_app\]\[INFO\] Grape [^ ]+ is running$'
          pid=
          for _ in $(seq 90); do
            [ -n "$pid" ] || pid=$(pids | head -n 1)
            if has "$running"; then break; fi
            if [ -n "$pid" ] && ! kill -0 "$pid" 2> /dev/null; then die "Grape exited before setup finished."; fi
            sleep 0.5
          done
          if ! has "$running"; then
            [ -f "$log" ] || die "No log at $log after 45 s: Grape never got as far as starting its logger."
            die "The log never said 'Grape <version> is running' in 45 s: setup didn't finish."
          fi
          [ -n "$pid" ] || pid=$(pids | head -n 1)
          [ -n "$pid" ] || die "Grape's log says it's running, but no process runs $bin."
          sleep 10
          kill -0 "$pid" 2> /dev/null || die "Grape (pid $pid) is gone 10 s after finishing setup."
          echo "Grape runs as pid $pid. First launch: $first."

          # A line's target is the module that logs it, nested ones included
          # (float::window).
          has '\]\[grape_app::sidecars\]\[INFO\] sidecars: found ffmpeg, ffprobe, bsdtar, pdfium$' || error "The log lacks the sidecars line naming all four."
          has '\]\[grape_app::wheel\]\[INFO\] drag monitor running$' || error "The log lacks 'drag monitor running'."
          has '\]\[grape_app::float::window\]\[INFO\] float: shelf window built$' || error "The log lacks the float shelf built at launch (D43)."
          if [ "$first" = yes ]; then
            has '\]\[grape_app::settings\]\[INFO\] settings: first launch; launch at login is on$' || error "The log lacks the first launch's launch at login."
            has "\]\[grape_app::settings\]\[INFO\] settings: the welcome card isn't dismissed yet; opening Settings$" || error "The log lacks the welcome card opening Settings."
            if [ ! -f "$agent" ]; then
              error "The first launch wrote no LaunchAgent at $agent."
            elif ! grep -q -- '<string>--at-login</string>' "$agent"; then
              error "$agent doesn't start Grape with --at-login."
            fi
          fi

          open -n "$app" || error "The second open -n failed."
          handover='\]\[grape_app\]\[INFO\] second launch: opening Settings in the running instance$'
          for _ in $(seq 20); do
            if has "$handover" && [ "$(pids | wc -l | tr -d ' ')" -eq 1 ]; then break; fi
            sleep 0.5
          done
          has "$handover" || error "The first Grape never logged the second launch."
          count=$(pids | wc -l | tr -d ' ')
          [ "$count" -eq 1 ] || error "$count Grape processes 10 s after the second launch, not 1: the second didn't hand over and exit."
          # Settings opens on a task after the handover line, so it gets a
          # moment before the log is read for errors.
          sleep 3
          kill -0 "$pid" 2> /dev/null || die "The first Grape exited after the second launch."
          while IFS= read -r line; do
            [ -z "$line" ] || error "Grape logged an error: $line"
          done <<< "$(new_log | grep -F '][ERROR] ' || true)"
          [ "$bad" -eq 0 ] || exit 1
          echo "Grape ran through its first launch, and a second one handed over to it."
      - if: ${{ !inputs.release }}
        uses: actions/upload-artifact@v7
        with:
          name: Grape-macOS-universal
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
      # Tauri names the DMG Grape_<version>_universal.dmg. The release file
      # has one name for every version, so the latest-release link works.
      - name: Name the DMG and hash it
        if: inputs.release
        run: |
          shopt -s nullglob
          dmgs=(target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "::error::Expected one .dmg in target/universal-apple-darwin/release/bundle/dmg, found ${#dmgs[@]}: ${dmgs[*]}"
            exit 1
          fi
          out="$RUNNER_TEMP/grape-release"
          mkdir -p "$out"
          cp "${dmgs[0]}" "$out/Grape-macOS-universal.dmg"
          hash=$(shasum -a 256 < "$out/Grape-macOS-universal.dmg" | cut -d ' ' -f 1)
          # sha256sum's format, with LF, so `sha256sum -c` reads it too.
          printf '%s  %s\n' "$hash" Grape-macOS-universal.dmg > "$out/SHA256SUMS"
          echo "Copied $(basename "${dmgs[0]}") to Grape-macOS-universal.dmg"
          cat "$out/SHA256SUMS"
      # The DMG is compressed already, so it isn't compressed again.
      - if: inputs.release
        uses: actions/upload-artifact@v7
        with:
          name: Grape-macOS-universal-release
          path: |
            ${{ runner.temp }}/grape-release/Grape-macOS-universal.dmg
            ${{ runner.temp }}/grape-release/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
