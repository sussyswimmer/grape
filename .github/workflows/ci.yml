name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust-windows:
    name: Rust (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # Same toolchain as rust-toolchain.toml, so clippy's lints match local runs.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  ui-windows:
    name: UI (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the pnpm version from package.json's packageManager field.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -C apps/desktop/ui typecheck
      - name: Test
        run: pnpm -C apps/desktop/ui test
      - name: Build
        run: pnpm -C apps/desktop/ui build

  # The macOS port (DECISIONS D18): lint and test on a Mac, like Windows.
  rust-macos:
    name: Rust (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Every crate's tests, even after one fails: the Mac runs are new.
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast

  # A Windows build anyone can download from the run's Artifacts: the
  # per-user NSIS installer (no admin needed). It's unsigned until M7, so
  # SmartScreen asks first: docs/PLATFORM_WINDOWS.md → "Running a CI build".
  build-windows:
    name: Build (Windows installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Build Grape and the installer
        working-directory: apps/desktop
        run: pnpm tauri build --bundles nsis --ci
      - uses: actions/upload-artifact@v7
        with:
          name: Grape-Windows-x64
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # A Mac build anyone can download from the run's Artifacts: a universal
  # (Apple silicon + Intel) Grape.app in a DMG. It's ad-hoc signed, not
  # notarized, so the first open needs the steps in docs/PLATFORM_MACOS.md
  # → "Running a CI build".
  build-macos:
    name: Build (macOS DMG)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Build Grape.app and the DMG
        working-directory: apps/desktop
        run: pnpm tauri build --target universal-apple-darwin --bundles app,dmg --ci
      - uses: actions/upload-artifact@v7
        with:
          name: Grape-macOS-universal
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # Third-party licenses (DECISIONS D23): every crate's license is allowed,
  # every crate comes from crates.io, and THIRD_PARTY_NOTICES.md matches
  # Cargo.lock. Linux is enough: both tools read the Windows and Mac graphs
  # from deny.toml and about.toml.
  licenses:
    name: Licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
      # Prebuilt binaries at the pinned versions, checked against the
      # action's SHA-256 list. No fallback to building or other installers.
      - uses: taiki-e/install-action@v2.87.27
        with:
          tool: cargo-deny@0.20.2,cargo-about@0.9.2
          fallback: none
      - name: Licenses, bans and sources
        run: cargo deny --locked check licenses bans sources
      # Needs the RustSec database from the network, so it never fails the
      # job. A finding shows as a failed step: read it, and take the fix
      # right away (DECISIONS D9).
      - name: Advisories (not blocking)
        continue-on-error: true
        run: cargo deny --locked check advisories
      - name: THIRD_PARTY_NOTICES.md is up to date
        run: |
          cargo about generate --locked --fail --manifest-path apps/desktop/src-tauri/Cargo.toml -c about.toml -o THIRD_PARTY_NOTICES.md about.hbs
          if ! git diff --exit-code -- THIRD_PARTY_NOTICES.md || [ -n "$(git status --porcelain -- THIRD_PARTY_NOTICES.md)" ]; then
            echo "::error file=THIRD_PARTY_NOTICES.md::THIRD_PARTY_NOTICES.md is out of date. Regenerate it from the repo root and commit it: cargo about generate --locked --fail --manifest-path apps/desktop/src-tauri/Cargo.toml -c about.toml -o THIRD_PARTY_NOTICES.md about.hbs"
            exit 1
          fi

  # Sidecars (DECISIONS D25): fetch FFmpeg and ffprobe as pinned in
  # scripts/sidecars.lock, check them, and list them. Nothing is built with
  # them: no installer or DMG carries FFmpeg until the media engine uses it
  # and licenses/ffmpeg and its notices entry exist (golden rule 6).
  sidecars:
    name: Sidecars (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      # The job runs the downloaded programs, so it keeps no git credentials.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Saved only by a run that fetched and checked everything. The script
      # checks a restored folder against its stamp and fetches again if
      # anything differs. The key has the scripts too: a restored folder
      # skips the download, extraction and -version checks, so a changed
      # script must miss the cache to be tested here.
      - uses: actions/cache@v6
        with:
          path: apps/desktop/src-tauri/binaries
          key: sidecars-${{ runner.os }}-${{ hashFiles('scripts/sidecars.lock', 'scripts/fetch-sidecars.ps1', 'scripts/fetch-sidecars.sh') }}
      # Windows PowerShell 5.1, which every PC has.
      - name: Fetch and check (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/fetch-sidecars.ps1
      - name: Run again in PowerShell 7 (must find them current)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = ./scripts/fetch-sidecars.ps1 6>&1 | Out-String
          Write-Output $out
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ($out -notmatch 'already current') {
            Write-Output "::error::A second run fetched the sidecars again instead of finding them current."
            exit 1
          }
      - name: List the sidecars
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -File -LiteralPath apps/desktop/src-tauri/binaries | Format-Table -AutoSize Name, Length
          Get-Content -LiteralPath apps/desktop/src-tauri/binaries/sidecars.stamp
      # /bin/bash is macOS's own bash 3.2; the runner's bash on PATH is newer.
      - name: Fetch and check (macOS)
        if: runner.os == 'macOS'
        run: /bin/bash ./scripts/fetch-sidecars.sh
      - name: Run again (must find them current)
        if: runner.os == 'macOS'
        run: |
          out=$(/bin/bash ./scripts/fetch-sidecars.sh)
          echo "$out"
          case "$out" in
            *"already current"*) ;;
            *)
              echo "::error::A second run fetched the sidecars again instead of finding them current."
              exit 1
              ;;
          esac
      - name: List the sidecars
        if: runner.os == 'macOS'
        run: |
          ls -l apps/desktop/src-tauri/binaries
          lipo -info apps/desktop/src-tauri/binaries/*-universal-apple-darwin
          cat apps/desktop/src-tauri/binaries/sidecars.stamp
