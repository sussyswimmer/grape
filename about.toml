# cargo-about config for THIRD_PARTY_NOTICES.md (DECISIONS D23).
# Regenerate from the repo root after any change to Cargo.lock:
#
#   cargo about generate --locked --fail --manifest-path apps/desktop/src-tauri/Cargo.toml -c about.toml -o THIRD_PARTY_NOTICES.md about.hbs
#
# CI runs the same command and fails if the file changed.

# The targets Grape ships for.
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

# Build tools and test-only crates never ship.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Grape's own crates are covered by LICENSE.
private = { ignore = true }

# Exactly the licenses the shipped crates use, in the order Grape picks them
# when a crate offers a choice. MPL-2.0 is allowed per crate below, never here.
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
]

# MPL-2.0 (DECISIONS O6). option-ext is compiled into Grape through Tauri's
# dirs crate. The other four run inside tauri-macros while Grape is built;
# cargo-about lists them because a proc-macro's dependencies count as normal
# dependencies. Keep this list the same as the exceptions in deny.toml.
[option-ext]
accepted = ["MPL-2.0"]

[cssparser]
accepted = ["MPL-2.0"]

[cssparser-macros]
accepted = ["MPL-2.0"]

[dtoa-short]
accepted = ["MPL-2.0"]

[selectors]
accepted = ["MPL-2.0"]

# Clarifications: crates whose license files cargo-about can't find or
# can't read. Each one points at the crate's own file (`files`), or, when
# the package has none, at the file in its repository at the commit the
# crate was published from (`git`). A checksum that stops matching fails
# the run, so a new version gets looked at again.

# windows-rs names its files `license-mit` and `license-apache-2.0`, which
# cargo-about doesn't scan. Grape takes MIT.
[windows.clarify]
license = "MIT OR Apache-2.0"
[[windows.clarify.files]]
path = "license-mit"
license = "MIT"
checksum = "c2cfccb812fe482101a8f04597dfc5a9991a6b2748266c47ac91b6a5aae15383"

