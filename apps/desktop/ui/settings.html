<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Grape Settings</title>
  </head>
  <body>
    <main class="settings">
      <header class="settings-header">
        <svg class="settings-mark" viewBox="0 0 64 64" aria-hidden="true">
          <rect class="mark-tile" width="64" height="64" rx="14" />
          <path class="mark-leaf" d="M32 15c3-5 9-7 14-5-2 5-8 8-14 5z" />
          <g class="mark-grapes">
            <circle cx="24" cy="25" r="7" />
            <circle cx="40" cy="25" r="7" />
            <circle cx="32" cy="35" r="7" />
            <circle cx="22" cy="38" r="6" />
            <circle cx="42" cy="38" r="6" />
            <circle cx="32" cy="48" r="6" />
          </g>
        </svg>
        <h1>Grape</h1>
      </header>
      <p class="lead">Grape is running in the notification area.</p>
      <h2>Settings on the way</h2>
      <ul class="planned" id="planned"></ul>
      <p class="note">
        Grape works offline. Your files never leave this computer.
      </p>
    </main>
    <script type="module" src="/src/settings.ts"></script>
  </body>
</html>
