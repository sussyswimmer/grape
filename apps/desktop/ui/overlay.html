<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Grape Overlay</title>
  </head>
  <body>
    <!--
      The overlay covers the whole monitor while the wheel is open. The
      wheel is drawn into #wheel from wheel://open (M1: a placeholder ring
      of numbered segments; M3: the real wheel).
    -->
    <svg id="overlay" class="overlay" role="img" aria-label="Grape wheel">
      <g id="wheel" hidden></g>
    </svg>
    <script type="module" src="/src/overlay.ts"></script>
  </body>
</html>
